<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - NPGLOW</title>
    <meta name="theme-color" content="#3ca6f2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f0f7ff 0%, #e8f4fd 50%, #f8fafc 100%);
            color: #1e293b;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 420px;
        }
        .icon-wrap {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: rgba(60, 166, 242, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        .icon-wrap svg {
            width: 56px;
            height: 56px;
            color: #3ca6f2;
        }
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            color: #0f172a;
        }
        p {
            color: #64748b;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem;
            background: white;
            border-radius: 999px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            font-weight: 700;
            color: #3ca6f2;
            font-size: 0.875rem;
        }
        .retry-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.875rem 2rem;
            background: #3ca6f2;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(60, 166, 242, 0.3);
            margin-bottom: 1.5rem;
        }
        .retry-btn:hover {
            background: #2e8ccf;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(60, 166, 242, 0.4);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 000-7.07m-4.243 9.9a9 9 0 01-6.364-2.636m2.829-2.828a5 5 0 010-7.072"></path>
            </svg>
        </div>
        <h1>Kamu Sedang Offline</h1>
        <p>Sepertinya perangkat kamu tidak terhubung ke internet. Periksa koneksi WiFi atau data seluler kamu, lalu coba lagi.</p>
        <button class="retry-btn" onclick="window.location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            Coba Lagi
        </button>
        <div class="brand">
             NPGLOW
        </div>
    </div>
</body>
</html>
